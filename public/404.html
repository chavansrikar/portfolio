<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Chavan Srikar</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@600;700&display=swap');

      :root {
        --void: #07060b;
        --amber: #fbbf24;
        --coral: #fb7185;
        --violet: #a855f7;
        --mist: #a09bb8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--void);
        color: #f2eefb;
        font-family: 'Space Grotesk', system-ui, sans-serif;
        overflow: hidden;
      }

      .wrap {
        text-align: center;
        padding: 2rem;
      }

      .ascii {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 700;
        line-height: 1;
        white-space: pre;
        font-size: clamp(6px, 2.1vw, 20px);
        background: linear-gradient(100deg, var(--amber), var(--coral) 30%, var(--violet) 70%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 0 22px rgba(251, 191, 36, 0.35));
      }

      h1 {
        margin: 1.6rem 0 0.6rem;
        font-size: clamp(1.6rem, 5vw, 3rem);
        letter-spacing: -0.03em;
      }

      p {
        margin: 0 0 2rem;
        color: var(--mist);
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.85rem;
      }

      a {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.85rem 1.8rem;
        border-radius: 999px;
        background: linear-gradient(100deg, var(--amber), var(--coral));
        color: var(--void);
        font-weight: 700;
        text-decoration: none;
        transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.3s;
      }

      a:hover {
        transform: translateY(-2px);
        box-shadow: 0 14px 40px -12px rgba(251, 191, 36, 0.7);
      }

      .grid {
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
        background-size: 64px 64px;
        mask-image: radial-gradient(ellipse at center, #000 5%, transparent 70%);
        pointer-events: none;
      }

      .glow {
        position: fixed;
        width: 40rem;
        height: 40rem;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(168, 85, 247, 0.22), transparent 62%);
        filter: blur(90px);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="glow" style="top: -12rem; left: -10rem"></div>
    <div class="glow" style="bottom: -14rem; right: -12rem; background: radial-gradient(circle, rgba(251,191,36,0.18), transparent 62%)"></div>

    <div class="wrap">
      <div class="ascii" id="art"></div>
      <h1>Route not found.</h1>
      <p>$ 404 · this path does not compile</p>
      <a href="/">← Back to the portfolio</a>
    </div>

    <script>
      const FONT = {
        '4': ['█▀▀█', ' █ █', ' █ █', ' █ █', '█▀▀█'],
        '0': [' ▄▀▄ ', '█▀ ▀█', '█   █', '█▄▄█', ' ▀▀▀ '],
        ' ': ['   ', '   ', '   ', '   ', '   '],
      }
      const text = '404'
      const rows = ['', '', '', '', '']
      for (const ch of text) {
        const g = FONT[ch]
        for (let r = 0; r < 5; r++) rows[r] += g[r] + ' '
      }
      document.getElementById('art').textContent = rows.join('\n')

      // Works for both user pages (/repo/) and project pages (/repo/portfolio/)
      const path = window.location.pathname.replace(/\/404\.html$/, '')
      document.querySelector('a').setAttribute('href', path || '/')
    </script>
  </body>
</html>
